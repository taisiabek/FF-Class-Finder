name: Refresh Fitness First schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-fitness-first-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch and validate timetable
        run: python3 scripts/update_schedule.py --index index.html --days 21

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = re.search(r"<script>(.*)</script>", html, re.S)
          if not script:
              raise SystemExit("No inline script found")
          Path("/tmp/app.js").write_text(script.group(1), encoding="utf-8")
          PY
          node --check /tmp/app.js

      - name: Publish updated timetable
        run: |
          if git diff --quiet -- index.html; then
            echo "No schedule changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Fitness First timetable"
          git push origin HEAD:main
